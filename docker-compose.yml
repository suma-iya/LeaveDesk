# browser → frontend (nginx :80, published as 3000) → backend (Go :8080) → db (Postgres :5432)
# Only the frontend is published, so the browser and the API share one origin.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leavedesk}
      POSTGRES_USER: ${POSTGRES_USER:-leavedesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leavedesk_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-leavedesk}:${POSTGRES_PASSWORD:-leavedesk_secret}@db:5432/${POSTGRES_DB:-leavedesk}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SESSION_TTL: ${SESSION_TTL:-8h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Dhaka}
      UPLOAD_DIR: /data/uploads
      LEAVE_DEFAULT_ANNUAL: ${LEAVE_DEFAULT_ANNUAL:-16}
      LEAVE_DEFAULT_CASUAL: ${LEAVE_DEFAULT_CASUAL:-3}
      LEAVE_DEFAULT_SICK: ${LEAVE_DEFAULT_SICK:-3}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:3000/api/auth/google/callback}
    volumes:
      - uploads:/data/uploads   # attachments and avatars, named by random UUID
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  pgdata:
  uploads:
