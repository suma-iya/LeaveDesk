# nginx does two jobs in the frontend container:
#  1. serve the built React files (index.html + /assets)
#  2. reverse-proxy /api/* to the Go backend, so the browser only ever
#     talks to one origin (no CORS needed, backend port stays private).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # "backend" is the docker-compose service name, resolved by Docker's DNS.
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build files never change, so browsers may cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router handles URLs like /employees/3 in the browser, so any
    # unknown path returns index.html instead of a 404.
    location / {
        add_header Cache-Control "no-cache";
        # Google Identity Services opens a popup; this policy keeps it working.
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        try_files $uri $uri/ /index.html;
    }
}
