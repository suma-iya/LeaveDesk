# nginx does two jobs in the frontend container:
#  1. serve the built React files (index.html + /assets)
#  2. reverse-proxy /api/* to the Go backend, so the browser only ever
#     talks to one origin (no CORS needed, backend port stays private).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS. Resolving per request (via the variable below) means a
    # recreated backend container with a new IP is picked up immediately.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # Attachments are up to 5 MB (nginx's default limit is 1 MB).
        client_max_body_size 6m;
        # "backend" is the docker-compose service name.
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build files never change, so browsers may cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;

        # nginx's mime.types has no .mjs entry; the PDF viewer's module
        # worker (pdf.worker.*.mjs) must be served as JavaScript to run.
        location ~ \.mjs$ {
            default_type application/javascript;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }

    # React Router handles URLs like /employees/3 in the browser, so any
    # unknown path returns index.html instead of a 404.
    location / {
        add_header Cache-Control "no-cache";
        # Google Identity Services opens a popup; this policy keeps it working.
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        try_files $uri $uri/ /index.html;
    }
}
